name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n (syntax check)
        run: |
          for f in boot-windows install/install.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          shellcheck -S warning boot-windows install/install.sh

      - name: Check for accidentally committed secrets
        run: |
          # 把扫描模式写进文件，避免匹配到扫描器自身
          PATTERN='ghp_|github_pat_|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rInE "$PATTERN" --exclude-dir=.git \
               --exclude='ci.yml' .; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "no secrets found"

      - name: Verify README internal links
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          md = pathlib.Path('README.md').read_text(encoding='utf-8')

          def slug(title):
              # GitHub 的锚点规则：转小写 → 去掉标点 → 每个空格替换成一个连字符
              t = title.strip().lower()
              t = re.sub(r'[^\w\s\u4e00-\u9fff-]', '', t)
              return re.sub(r'\s', '-', t)

          headings = {slug(m.group(2))
                      for m in re.finditer(r'^(#{2,6})\s+(.*)$', md, re.M)}
          anchors = set(re.findall(r'\]\(#([^)]+)\)', md))

          bad_links = []
          for m in re.finditer(r'\]\(([^)#][^)]*)\)', md):
              target = m.group(1).split('#')[0]
              if target and not target.startswith(('http://', 'https://')):
                  if not pathlib.Path(target).exists():
                      bad_links.append(target)

          bad_anchors = sorted(anchors - headings)
          if bad_links or bad_anchors:
              if bad_links:
                  print('broken file links:', bad_links)
              if bad_anchors:
                  print('broken anchors:', bad_anchors)
              sys.exit(1)
          print(f'all {len(anchors)} anchors and file links OK')
          PY
